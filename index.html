<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material Innuendo Generator</title>
<style>
  :root{--bg:#171717;--panel:#232323;--text:#f4f4f4;--muted:#aaa;--accent:#ff6b4a;--line:#3a3a3a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:820px;margin:auto;padding:42px 20px 60px}
  h1{font-size:clamp(28px,6vw,46px);margin:0 0 8px}
  .sub{color:var(--muted);margin:0 0 28px}
  button{display:block;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:20px;font-weight:700;padding:17px 20px;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  #results{display:grid;gap:16px;margin-top:28px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  h2{margin:0 0 12px;font-size:22px}
  ol{margin:0;padding-left:28px}
  li{padding:6px 0;line-height:1.35}
  .hint{text-align:center;color:var(--muted);padding:30px 10px}
  footer{text-align:center;color:#777;font-size:12px;margin-top:28px}
</style>
</head>
<body>
<main>
  <h1>Material Innuendo Generator</h1>
  <p class="sub">20 cheeky slogans. One click. No questions asked.</p>
  <button id="generate">Generate Innuendos</button>
  <div id="results"><div class="hint">Press the button to get your first load.</div></div>
  <footer>Meat · Wood · Coal · Iron</footer>
</main>
<script>
const data = {
  Meat: [
    "Get your hands on some proper meat.",
    "Big, juicy and ready to handle.",
    "Nothing beats a good bit of meat.",
    "Firm on the outside, juicy in the middle.",
    "Come for the meat. Stay for the satisfaction.",
    "A hefty cut with plenty to get your teeth into.",
    "The bigger the piece, the better the feast.",
    "Fresh, firm and full of promise.",
    "Put a little more meat on the table.",
    "Serious meat. No messing about.",
    "Thick, juicy and hard to resist.",
    "Give it a good grip and get stuck in.",
    "A substantial load of meat.",
    "The sort of meat that fills both hands.",
    "Hard to beat when it's this big and juicy.",
    "Get your fill of the good stuff.",
    "A meaty handful.",
    "Plenty of meat for everyone.",
    "Heavy, juicy and satisfying.",
    "If you like it big, you'll love this."
  ],
  Wood: [
    "Hard, long and good to the core.",
    "Nothing beats a good piece of wood.",
    "Big timber. Firm finish.",
    "Get a grip on something solid.",
    "Long, hard and ready for action.",
    "A proper bit of wood to get your hands on.",
    "Solid, stiff and built to last.",
    "It's not the size of the pile. It's how you use it.",
    "Come for the wood. Stay for the warmth.",
    "A big log with plenty of potential.",
    "Hardwood for serious handling.",
    "Firm in the hand, satisfying to work with.",
    "Get your hands around some quality timber.",
    "The bigger the log, the better the load.",
    "Long-lasting, hard-wearing and very satisfying.",
    "A hefty piece of timber.",
    "Wood this good is hard to handle.",
    "Stack it high. Keep it firm.",
    "A solid load of wood.",
    "Big, hard and naturally impressive."
  ],
  Coal: [
    "Hot, black and ready to burn.",
    "Get your hands on a big load.",
    "Nothing like a hot bit of coal.",
    "Dirty, heavy and satisfying.",
    "A firm grip on a serious load.",
    "Big lumps. Plenty of heat.",
    "Get stuck into a proper pile.",
    "Hotter when you pile it up.",
    "A heavy load with serious potential.",
    "Black, dirty and hard to resist.",
    "Give it a squeeze and feel the heat.",
    "A big sack of the good stuff.",
    "Load it up and get it burning.",
    "Hot, hard and built for the long haul.",
    "There's nothing small about this pile.",
    "Get your hands dirty with a proper load.",
    "A hefty lump that packs some heat.",
    "The bigger the pile, the hotter it gets.",
    "Hard to keep your hands off a good load.",
    "Come for the coal. Stay for the heat."
  ],
  Iron: [
    "Hard, heavy and impossible to ignore.",
    "Get a firm grip on something substantial.",
    "Big, solid and built to last.",
    "Nothing beats a bit of hard iron.",
    "Heavy metal for serious handling.",
    "Strong, stiff and ready for work.",
    "Get your hands around a proper piece of iron.",
    "A hefty load of hard stuff.",
    "Firm in the hand and heavy in the pocket.",
    "Built hard. Handles harder.",
    "Big iron. No half measures.",
    "Solid, heavy and satisfying.",
    "Put some weight behind it.",
    "Hard to handle. Harder to resist.",
    "A serious lump of metal.",
    "Heavy enough to make an impression.",
    "Get a grip. This one's got weight.",
    "Stiff, strong and dependable.",
    "All the right kind of heavy.",
    "If you want it hard and heavy, choose iron."
  ]
};

function pickFive(arr){
  const pool=[...arr];
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  return pool.slice(0,5);
}

document.getElementById('generate').addEventListener('click',()=>{
  const results=document.getElementById('results');
  results.innerHTML='';
  for(const material of ['Meat','Wood','Coal','Iron']){
    const section=document.createElement('section');
    const h2=document.createElement('h2');
    h2.textContent=material;
    const ol=document.createElement('ol');
    pickFive(data[material]).forEach(s=>{
      const li=document.createElement('li');
      li.textContent=s;
      ol.appendChild(li);
    });
    section.append(h2,ol);
    results.appendChild(section);
  }
  window.scrollTo({top:document.getElementById('results').offsetTop-20,behavior:'smooth'});
});
</script>
</body>
</html>
